<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Csak Nálam? – Ellenőrizd, hogy egy weboldal tényleg leállt-e</title>
<meta name="description" content="Írd be egy weboldal címét, és pár másodperc alatt megtudod, hogy csak nálad nem működik, vagy tényleg mindenkinek leállt.">
<meta property="og:title" content="Csak Nálam? – Weboldal elérhetőség ellenőrző">
<meta property="og:description" content="Írd be egy weboldal címét, és megtudod, hogy csak nálad nem működik, vagy tényleg leállt.">
<meta property="og:type" content="website">
<meta name="robots" content="index, follow">
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --up: #16a34a;
    --up-bg: #ecfdf3;
    --down: #dc2626;
    --down-bg: #fef2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #f1f2f4;
      --muted: #9aa2af;
      --border: #2a2e37;
      --accent: #5b8def;
      --up: #4ade80;
      --up-bg: rgba(74,222,128,0.12);
      --down: #f87171;
      --down-bg: rgba(248,113,113,0.12);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header { text-align: center; padding: 48px 16px 8px; }
  header h1 { font-size: 2rem; margin: 0 0 8px; }
  header p { color: var(--muted); margin: 0; }
  main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }
  form { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1;
    padding: 14px 16px;
    font-size: 1rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  button {
    padding: 14px 20px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .examples { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .examples button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-weight: 400;
    font-size: 0.85rem;
    padding: 6px 12px;
  }
  .result { margin-top: 20px; border-radius: 12px; padding: 20px; display: none; }
  .result.up { background: var(--up-bg); border: 1px solid var(--up); display: block; }
  .result.down { background: var(--down-bg); border: 1px solid var(--down); display: block; }
  .result .headline { font-size: 1.3rem; font-weight: 700; margin: 0 0 6px; }
  .result.up .headline { color: var(--up); }
  .result.down .headline { color: var(--down); }
  .result .detail { color: var(--muted); font-size: 0.9rem; margin: 0; }
  .ad-slot {
    margin: 24px 0;
    min-height: 0;
    /* Ide kerül majd a Google AdSense (vagy más hirdetési) kód,
       miután az oldal élesedett és jóváhagyták az AdSense fiókot.
       Amíg nincs jóváhagyva a hirdetés, ez a doboz szándékosan üres. */
  }
  footer { text-align: center; padding: 24px 16px; color: var(--muted); font-size: 0.85rem; }
  footer a { color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>Csak nálam nem működik, vagy tényleg leállt?</h1>
  <p>Írd be a weboldal címét, és pár másodperc alatt kiderül.</p>
</header>

<main>
  <div class="card">
    <form id="checkForm">
      <input type="text" id="urlInput" placeholder="pl. pelda.hu vagy https://pelda.hu" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <button type="submit" id="submitBtn">Ellenőrzöm</button>
    </form>
    <div class="examples">
      <span style="align-self:center; color:var(--muted); font-size:0.85rem;">Próbáld ki:</span>
      <button type="button" data-example="google.com">google.com</button>
      <button type="button" data-example="facebook.com">facebook.com</button>
      <button type="button" data-example="wikipedia.org">wikipedia.org</button>
    </div>

    <div class="result" id="result">
      <p class="headline" id="resultHeadline"></p>
      <p class="detail" id="resultDetail"></p>
    </div>
  </div>

  <div class="ad-slot" id="ad-slot-1"></div>
</main>

<footer>
  <p>
    <a href="/about.html">Rólunk</a> ·
    <a href="/privacy.html">Adatvédelem</a>
  </p>
</footer>

<script>
  const form = document.getElementById('checkForm');
  const input = document.getElementById('urlInput');
  const btn = document.getElementById('submitBtn');
  const result = document.getElementById('result');
  const headline = document.getElementById('resultHeadline');
  const detail = document.getElementById('resultDetail');

  document.querySelectorAll('[data-example]').forEach((b) => {
    b.addEventListener('click', () => {
      input.value = b.getAttribute('data-example');
      form.requestSubmit();
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const value = input.value.trim();
    if (!value) return;

    btn.disabled = true;
    btn.textContent = 'Ellenőrzés...';
    result.className = 'result';
    result.style.display = 'none';

    try {
      const res = await fetch('/api/check?url=' + encodeURIComponent(value));
      const data = await res.json();

      if (!res.ok) {
        result.className = 'result down';
        headline.textContent = 'Nem sikerült ellenőrizni';
        detail.textContent = data.error || 'Ismeretlen hiba történt.';
        return;
      }

      if (data.up) {
        result.className = 'result up';
        headline.textContent = 'Úgy tűnik, nálunk működik ✅';
        detail.textContent = 'HTTP állapot: ' + data.status + ' · Válaszidő: ' + data.latencyMs + ' ms — tehát valószínűleg nálad (vagy a hálózatodnál) van a hiba, ha te mégsem érted el.';
      } else {
        result.className = 'result down';
        headline.textContent = 'Nálunk sem érhető el ⚠️';
        const reason = data.error === 'timeout'
          ? 'Az oldal nem válaszolt időben.'
          : data.error === 'network_error'
            ? 'Nem sikerült kapcsolódni az oldalhoz (lehet, hogy tényleg leállt, vagy elgépelted a címet).'
            : ('HTTP állapot: ' + data.status);
        detail.textContent = reason + ' Ez alapján nem csak nálad, hanem általánosan sem működik.';
      }
    } catch (err) {
      result.className = 'result down';
      headline.textContent = 'Nem sikerült ellenőrizni';
      detail.textContent = 'Hiba történt a lekérdezés közben. Próbáld újra.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Ellenőrzöm';
      result.style.display = 'block';
    }
  });
</script>

</body>
</html>
